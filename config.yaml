country:
  name: Yemen
  gdelt_code: YM          # FIPS 10-4, не ISO-2 (YE)
  iso2: YE

event:
  root_codes: ["18", "19"]  # CAMEO: Assault / Fight

data:
  start_date: "2022-01-01"
  end_date: "2026-09-13"
  gdelt_bulk_base_url: "https://data.gdeltproject.org/events/"
  raw_daily_dir: "data/raw/gdelt_daily"
  raw_combined_path: "data/raw/gdelt_yemen_events_raw.parquet"
  trends_cache_path: "data/raw/trends/google_trends_weekly.csv"
  weekly_panel_path: "data/processed/weekly_panel.parquet"
  download_manifest_path: "data/raw/download_manifest.json"

external_regressor:
  source: google_trends
  keyword: "Yemen war"
  geo: ""

target:
  variant: A                 # регрессия, вариант B считается рядом как bonus
  horizons: [1, 2, 3, 4]
  strategy: direct
  escalation_rolling_window_weeks: 52
  escalation_zscore_k: 2.0

validation:
  holdout_weeks: 12
  cv_initial_train_weeks: 52
  cv_step_weeks: 4
  min_test_weeks_per_fold: 4

random_seed: 42
